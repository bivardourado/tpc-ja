<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Participantes - TPUBLI</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .import-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .import-card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .file-input-wrapper {
            margin: 2rem 0;
            padding: 2rem;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary-color);
            background: rgba(74, 144, 226, 0.05);
        }

        .file-input-wrapper input {
            display: none;
        }

        .progress-container {
            margin: 2rem 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: var(--border-color);
            border-radius: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .log-container {
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            display: none;
        }

        .log-entry {
            padding: 0.25rem 0;
        }

        .log-success {
            color: #28a745;
        }

        .log-error {
            color: #dc3545;
        }

        .log-warning {
            color: #ffc107;
        }

        .log-info {
            color: #17a2b8;
        }
    </style>
</head>

<body>
    <div class="import-container">
        <div class="import-card">
            <h1>📊 Importar Participantes</h1>
            <p>Importe participantes de um arquivo Excel (.xls ou .xlsx)</p>

            <div class="file-input-wrapper" id="fileInputWrapper">
                <input type="file" id="fileInput" accept=".xls,.xlsx">
                <div>
                    <p style="font-size: 3rem; margin: 0;">📁</p>
                    <p><strong>Clique para selecionar arquivo</strong></p>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        Arquivo Excel com colunas: NOME, TELEFONE, CONGREGAÇÃO
                    </p>
                </div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <p id="progressText" style="text-align: center; margin-top: 1rem;"></p>
            </div>

            <div class="log-container" id="logContainer"></div>

            <div style="margin-top: 2rem; text-align: center;">
                <button class="btn-secondary" onclick="window.location.href='/admin'">
                    ← Voltar para Admin
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/importar.js"></script>
</body>

</html>
